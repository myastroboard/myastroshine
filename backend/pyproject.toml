[project]
name = "myastroshine-backend"
version = "0.1.0"
description = "MyAstroShine - astronomical image processing engine"
requires-python = ">=3.15"
license = { text = "AGPL-3.0-or-later" }

[tool.ruff]
extend = "../ruff.toml"
src = ["app", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on function calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# Tests: magic values, assert, deferred imports, subprocess calls, and fixture
# passwords (S105, the admin-auth tests log in with literal test passwords) are all fine.
"tests/*" = ["PLR2004", "S101", "PLC0415", "S603", "S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95
