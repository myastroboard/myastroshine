[project]
name = "myastroshine-backend"
version = "0.1.0"
description = "MyAstroShine - astronomical image processing engine"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }

[tool.ruff]
extend = "../ruff.toml"
src = ["app", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on function calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# Tests: magic values, assert, deferred imports, and subprocess calls are all fine.
"tests/*" = ["PLR2004", "S101", "PLC0415", "S603"]

[tool.mypy]
python_version = "3.14"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["cv2.*", "skimage.*", "astropy.*", "rawpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `packages = ["app"]` above already keeps `mypy app` (CI, CONTRIBUTING.md) from
# ever touching tests/, but an IDE's mypy integration analyzes whatever file is
# open regardless - this mirrors that same intent (see ruff's tests/*
# per-file-ignores above) so it doesn't flag every untyped pytest fixture/test
# function.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=app --cov-report=term-missing"
filterwarnings = [
    # Emitted only when a newer starlette than we pin is installed locally.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
