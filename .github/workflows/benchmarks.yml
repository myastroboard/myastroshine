name: Performance benchmarks

# Checks the acceptance criteria in initial_plan/10_IMPLEMENTATION_ROADMAP.md
# "Success Metrics" (full-res enhance < 5s, slider response < 500ms, stacking
# SNR gain ~sqrt(N)). Runs weekly and on demand, not on every push/PR: wall-clock
# budgets are sensitive to which runner picks up the job, so this is a signal to
# investigate on failure, not a merge gate. See tests/benchmarks/*.py.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC (after the deps-fresh check)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: RUN_BENCHMARKS=1 pytest tests/benchmarks --no-cov -v
