# Shared Ruff baseline for the whole repository.
# backend/pyproject.toml extends this with backend-specific settings.

line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "S", "RUF"]
ignore = ["PLR0913"]

[lint.per-file-ignores]
"scripts/*" = ["S310"]  # urllib against a fixed allowlist of registry hosts
