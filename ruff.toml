# Ruff configuration for the whole repository.
# Extends the organization baseline (E, F, W, I, UP, B, line length 100), synced from
# myastroboard/.github; backend/pyproject.toml extends this with backend-specific settings.

extend = ".github/org/ruff.base.toml"
target-version = "py314"

[lint]
extend-select = ["SIM", "PL", "S", "RUF"]
# PLR0913/PLR0917: FastAPI routes and service constructors legitimately take
# many (keyword) arguments via dependency injection.
ignore = ["PLR0913", "PLR0917"]

[lint.per-file-ignores]
"scripts/*" = ["S310"]  # urllib against a fixed allowlist of registry hosts
