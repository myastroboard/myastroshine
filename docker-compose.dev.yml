# MyAstroShine - development stack with hot reload.
#
#   docker compose -f docker-compose.dev.yml up
#
# - api: uvicorn --reload, source bind-mounted; runs the processing jobs too
# - web: Vite dev server with HMR, source bind-mounted
# - data and the SQLite db live in ./data on the host

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Vite (the web service below) serves the frontend live - skip building it.
      target: backend
    container_name: myastroshine-api-dev
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8002
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: development
      LOG_LEVEL: debug
      DATA_DIR: /data
      # inotify does not fire over a Docker Desktop bind mount on Windows/macOS, so
      # uvicorn --reload (watchfiles) misses code edits without polling - same
      # reason the web service sets VITE_USE_POLLING.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./data:/data
      # Optional external ML engines (StarNet2 / DeepSNR). Nothing is bundled -
      # see docs/DEPLOYMENT.md "External ML engines". The ./engines dir is always
      # mounted (empty and inert by default); drop the binary in it and set
      # starnet2_path (e.g. /opt/engines/starnet2/starnet2) in Settings.
      - ./engines:/opt/engines:ro
    restart: unless-stopped
  web:
    image: node:24-alpine
    container_name: myastroshine-web-dev
    working_dir: /app
    command: sh -c "npm install --no-fund --no-audit && npm run dev -- --host 0.0.0.0"
    environment:
      # No VITE_API_URL/VITE_WS_URL: the app talks to :3000 and Vite proxies
      # /api and /ws to the api service (so backend-relative image URLs work too).
      - VITE_PROXY_TARGET=http://api:8002
      - VITE_USE_POLLING=1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - myastroshine_web_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  myastroshine_web_node_modules:

networks:
  default:
    name: myastroshine-dev
