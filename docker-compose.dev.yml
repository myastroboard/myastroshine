# MyAstroShine - development stack with hot reload.
#
#   docker compose -f docker-compose.dev.yml up
#
# - api: uvicorn --reload, source bind-mounted, code changes restart the server
# - web: Vite dev server with HMR, source bind-mounted
# - data and the SQLite db live in ./data on the host

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myastroshine-api-dev
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8002
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=debug
      - DATABASE_URL=sqlite:////data/db/myastroshine.db
      - STORAGE_PATH=/data/images
      - API_CORS_ORIGINS=http://localhost:3000
      - ASTRODEX_WEBHOOK_SECRET=${ASTRODEX_WEBHOOK_SECRET:-dev-secret}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      - redis
    restart: unless-stopped

  web:
    image: node:24-alpine
    container_name: myastroshine-web-dev
    working_dir: /app
    command: sh -c "npm install --no-fund --no-audit && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8002/api
      - VITE_WS_URL=ws://localhost:8002/ws
      - VITE_USE_POLLING=1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - myastroshine_web_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: myastroshine-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --save "" --appendonly no

volumes:
  myastroshine_web_node_modules:

networks:
  default:
    name: myastroshine-dev
