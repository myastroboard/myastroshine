# MyAstroShine - full stack orchestration.

x-backend-env: &backend-env
  PYTHONUNBUFFERED: "1"
  APP_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: sqlite:////data/db/myastroshine.db
  STORAGE_PATH: /data/images
  API_CORS_ORIGINS: http://localhost:3000,http://myastroshine.local
  ASTRODEX_WEBHOOK_SECRET: ${ASTRODEX_WEBHOOK_SECRET:-change-me}
  ASTRODEX_CALLBACK_URLS: ${ASTRODEX_CALLBACK_URLS:-}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  # queue mode: /process and /stack/*/process run on the worker, progress on the WS
  PROCESSING_MODE: queue

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myastroshine-api
    environment: *backend-env
    ports:
      - "8002:8002"
    volumes:
      - myastroshine_images:/data/images
      - myastroshine_db:/data/db
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myastroshine-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-env
    volumes:
      - myastroshine_images:/data/images
      - myastroshine_db:/data/db
    depends_on:
      - redis
      - api
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myastroshine-web
    environment:
      - VITE_API_URL=http://localhost:8002/api
      - VITE_WS_URL=ws://localhost:8002/ws
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: myastroshine-redis
    ports:
      - "6379:6379"
    volumes:
      - myastroshine_redis:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

volumes:
  myastroshine_images:
    driver: local
  myastroshine_db:
    driver: local
  myastroshine_redis:
    driver: local

networks:
  default:
    name: myastroshine
