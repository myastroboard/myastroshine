# MyAstroShine - full stack orchestration.
#
#   docker compose up -d
#
# No .env editing required. The only variables here are structural (run mode,
# persistence root). Everything else - CORS, AstroDex
# allowlist, upload limits, stacking defaults, log levels - is auto-generated or
# edited from Settings in the UI and persisted under the data volume
# (app_settings.json, secret_key.txt). See docs/DEPLOYMENT.md.
#
# One container: image and stack processing run as background jobs inside the
# api process - no worker, no Redis.
#
# `api` carries both `image:` and `build:`. On a clean machine (no repo
# clone), `docker compose up -d` pulls the published `image:` from Docker Hub -
# one image serves both the API and the web UI on :8002. If you've cloned the
# repo, `docker compose up -d --build` (or `build` first) uses the local
# Dockerfile instead. Pin a version with `MYASTROSHINE_VERSION=0.1.0 docker
# compose up -d` (default: `latest`).

services:
  api:
    image: myastroboard/myastroshine:${MYASTROSHINE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myastroshine-api
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      DATA_DIR: /data
    ports:
      - "8002:8002"
    volumes:
      - myastroshine_data:/data
      # Optional external ML engines (StarNet2 star removal / DeepSNR denoise).
      # Nothing is bundled - see docs/DEPLOYMENT.md "External ML engines" and
      # THIRD_PARTY.md. The ./engines dir is always mounted (empty and inert by
      # default); drop the operator-installed binary in it and set starnet2_path
      # (e.g. /opt/engines/starnet2/starnet2) in Settings -> Advanced.
      - ./engines:/opt/engines:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  myastroshine_data:
    driver: local

networks:
  default:
    name: myastroshine
